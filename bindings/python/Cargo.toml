[package]
name = "paintcode-py"
description = "Python binding of the paintcode core (module paintcode_core)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "paintcode_core"
crate-type = ["cdylib"]

[dependencies]
paintcode.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[workspace]
resolver = "3"
members = ["crates/paintcode", "bindings/python"]

[workspace.package]
version = "0.6.0"
edition = "2024"
# pyo3 0.30 and edition 2024 both need 1.85; CI checks it
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/AsherJingkongChen/paintcode"

[workspace.dependencies]
paintcode = { path = "crates/paintcode" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rayon = "1"
png = "0.18"
flate2 = "1"

# opt-level "s" renders as fast as 3 and is 38% smaller (measured in the commit that set it).
# panic must stay "unwind": PyO3 turns panics into Python exceptions; "abort" kills Python.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"

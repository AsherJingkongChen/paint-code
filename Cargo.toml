[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/AsherJingkongChen/paint-code"

[workspace.dependencies]
paintcode-math = { path = "crates/math" }
paintcode-scene = { path = "crates/scene" }
paintcode-render = { path = "crates/render" }
paintcode-stroke = { path = "crates/stroke" }
paintcode-io = { path = "crates/io" }
paintcode = { path = "crates/paintcode" }
serde_json = "1"
rayon = "1"
png = "0.18"

[profile.release]
codegen-units = 1
lto = "thin"

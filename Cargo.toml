[workspace]
resolver = "2"
members = ["crates/paintcode", "bindings/python"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/AsherJingkongChen/paintcode"

[workspace.dependencies]
paintcode = { path = "crates/paintcode" }
serde_json = "1"
rayon = "1"
png = "0.18"

[profile.release]
codegen-units = 1
lto = "thin"

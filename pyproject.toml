[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paint-code"
version = "0.2.0"
description = "A small dab engine: brush strokes as rows of anisotropic 2D Gaussians, driven by JSON."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
paintcode = "paintcode.__main__:main"

[tool.setuptools]
packages = ["paintcode"]

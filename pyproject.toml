[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "paintcode"
description = "A small dab engine: brush strokes as rows of anisotropic 2D Gaussians, driven by JSON."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[dependency-groups]
# numpy and Pillow are for the tests and the example scripts, not for the package
dev = ["pytest>=7", "numpy>=1.24", "pillow>=10"]

[project.scripts]
paintcode = "paintcode:main"

# The engine is Rust, built from bindings/python into paintcode._core; python/paintcode/ only
# re-exports it and carries the type stub. Keeping that under python/ means a Python started at
# the repository root cannot import a half-built package by accident.
[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "paintcode._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild the extension whenever any Rust source changes, not only this file
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/paintcode/Cargo.toml" },
    { file = "crates/paintcode/src/**/*.rs" },
    { file = "bindings/python/Cargo.toml" },
    { file = "bindings/python/src/**/*.rs" },
]

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine tests (behaviour, golden output from the 0.4 numpy engine, fast path = reference path, layering)
        run: cargo test --release -p paintcode -- --include-ignored
      - name: The engine built as a Python module (from uv.lock)
        run: uv sync --locked
      - name: Python tests (arguments, bytes, errors)
        run: uv run pytest -q

  msrv:
    # rust-version in Cargo.toml says 1.88; this keeps that true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Build the engine and the binding with the oldest supported Rust
        run: cargo check --workspace --all-targets

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests (the fast path bit-identical to the reference path; module layering)
        run: cargo test --release -p paintcode
      - name: Python reference, and the core built as a Python module (from uv.lock)
        run: uv sync --locked
      - name: Python tests (the core within 1e-5 of the reference)
        run: uv run pytest -q
